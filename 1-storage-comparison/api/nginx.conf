user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events { worker_connections 8192; }

http {
    types {
        text/html                       html;
        text/plain                      txt;
        application/json                json;
        application/vnd.apple.mpegurl   m3u8;
        video/mp2t                      ts;
        video/mp4                       mp4;
    }
    default_type application/octet-stream;

    log_format demo '$remote_addr "$request" $status $body_bytes_sent rt=$request_time xff="$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log demo;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio threads;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;

        location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }

        # Same files, three storage backends, served with the CloudFront cache OFF
        # (the distribution passes these through). Browse them: /ebs/video/
        location /ebs/ {
            if (-f /var/lib/demo/outage) { return 503; }
            alias /mnt/ebs/;  autoindex on;
            add_header X-Storage-Backend ebs always;
            add_header Cache-Control no-store always;
        }
        location /efs/ {
            if (-f /var/lib/demo/outage) { return 503; }
            alias /mnt/efs/;  autoindex on;
            add_header X-Storage-Backend efs always;
            add_header Cache-Control no-store always;
        }
        location /nvme/ {
            if (-f /var/lib/demo/outage) { return 503; }
            alias /mnt/nvme/; autoindex on;
            add_header X-Storage-Backend nvme always;
            add_header Cache-Control no-store always;
        }

        # The same files with the CloudFront cache ON: the distribution caches
        # /cached/* and the header lets the edge keep them for a day while the
        # browser still revalidates. Used by the Analysis tab ("CDN in front of all").
        location ~ ^/cached/(ebs|efs|nvme)/(.*)$ {
            if (-f /var/lib/demo/outage) { return 503; }
            alias /mnt/$1/$2;
            add_header X-Storage-Backend $1 always;
            add_header Cache-Control "public, max-age=0, s-maxage=86400" always;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }
}
